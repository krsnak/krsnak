name: Update Czech TV EPG
on:
  push:
    paths:
      - "tv-epg/build_epg.py"
      - ".github/workflows/update-cz-tv-epg.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-cz-tv-epg
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tv-epg/build_epg.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tv-epg/epg.xml tv-epg/guide.m3u
          git diff --cached --quiet && exit 0
          git commit -m "Update Czech TV EPG"
          git pull --rebase origin main
          git push
